# Render Blueprint for the staging environment.
# Automatic deploys stay disabled until staging values and secret files are set.

databases:
  - name: hvac-ops-staging-db
    plan: free
    postgresMajorVersion: "16"
    databaseName: hvac_ops_staging
    user: hvac_ops_staging
    ipAllowList: []

services:
  - type: web
    name: hvac-ops-staging-backend
    runtime: docker
    plan: starter
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    preDeployCommand: python manage.py migrate
    healthCheckPath: /api/health/
    autoDeployTrigger: "off"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: hvac-ops-staging-backend
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: DATABASE_URL
        fromDatabase:
          name: hvac-ops-staging-db
          property: connectionString
      - key: DATABASE_CONNECT_TIMEOUT
        value: "5"
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: hvac-ops-staging-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: BACKEND_PUBLIC_BASE_URL
        fromService:
          type: web
          name: hvac-ops-staging-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: hvac-ops-staging-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: CSRF_TRUSTED_ORIGINS
        fromService:
          type: web
          name: hvac-ops-staging-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "True"
      - key: SECURE_HSTS_PRELOAD
        value: "True"
      - key: TIME_ZONE
        value: America/Los_Angeles
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TECHNICIAN_BOT_TOKEN
        sync: false
      - key: TECHNICIAN_BOT_USERNAME
        sync: false
      - key: TECHNICIAN_API_SHARED_SECRET
        generateValue: true
      - key: GOOGLE_SERVICE_ACCOUNT_JSON_PATH
        value: /etc/secrets/google-service-account.json
      - key: GOOGLE_CALENDAR_SCOPES
        value: https://www.googleapis.com/auth/calendar
    disk:
      name: hvac-ops-staging-media
      mountPath: /app/media
      sizeGB: 1

  - type: worker
    name: hvac-ops-staging-technician-bot
    runtime: docker
    plan: starter
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m telegram_bots.technician_bot.main
    autoDeployTrigger: "off"
    envVars:
      - key: TECHNICIAN_BOT_TOKEN
        fromService:
          type: web
          name: hvac-ops-staging-backend
          envVarKey: TECHNICIAN_BOT_TOKEN
      - key: TECHNICIAN_API_SHARED_SECRET
        fromService:
          type: web
          name: hvac-ops-staging-backend
          envVarKey: TECHNICIAN_API_SHARED_SECRET
      - key: BACKEND_API_BASE_URL
        fromService:
          type: web
          name: hvac-ops-staging-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: BACKEND_PUBLIC_BASE_URL
        fromService:
          type: web
          name: hvac-ops-staging-backend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: hvac-ops-staging-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: "off"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: hvac-ops-staging-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
