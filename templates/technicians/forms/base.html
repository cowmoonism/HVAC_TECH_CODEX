<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --surface: #ffffff;
      --text: #162033;
      --muted: #65738a;
      --line: #d8dee9;
      --accent: #0f766e;
      --accent-dark: #0b5f59;
      --danger: #b42318;
      --success: #067647;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
    }
    main {
      width: min(720px, 100%);
      margin: 0 auto;
      padding: 20px 14px 40px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 26px;
      letter-spacing: 0;
    }
    .subtitle {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
    }
    .event-picker {
      margin: 0 0 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 8px 24px rgba(20, 32, 50, 0.08);
    }
    .event-picker h2 {
      margin: 0 0 8px;
      font-size: 17px;
      letter-spacing: 0;
    }
    .event-picker p {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 13px;
    }
    .event-list {
      display: grid;
      gap: 8px;
    }
    .event-option {
      width: 100%;
      margin: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      background: #fbfcfe;
      text-align: left;
      font-weight: 400;
    }
    .event-option strong,
    .event-option span {
      display: block;
    }
    .event-option strong {
      font-size: 14px;
      font-weight: 700;
    }
    .event-option span {
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
    }
    .event-option.selected {
      border-color: var(--accent);
      background: #ecfdf3;
    }
    form {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(20, 32, 50, 0.08);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    @media (min-width: 640px) {
      .grid.two { grid-template-columns: 1fr 1fr; }
      .full { grid-column: 1 / -1; }
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      font-size: 14px;
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      font: inherit;
      color: var(--text);
      background: #fff;
    }
    textarea { min-height: 96px; resize: vertical; }
    button {
      width: 100%;
      margin-top: 18px;
      border: 0;
      border-radius: 8px;
      padding: 14px 16px;
      font: inherit;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
    }
    button:disabled { opacity: 0.65; }
    button:not(:disabled):active { background: var(--accent-dark); }
    .result {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      white-space: pre-wrap;
    }
    .result.success {
      display: block;
      color: var(--success);
      background: #ecfdf3;
    }
    .result.error {
      display: block;
      color: var(--danger);
      background: #fef3f2;
    }
  </style>
</head>
<body>
  <main>
    <h1>{{ title }}</h1>
    <p class="subtitle">Submitted securely to the HVAC Operations backend.</p>
    {% block form %}{% endblock %}
  </main>
  <script>
    const endpoint = "{{ endpoint }}";
    const telegramWebApp = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (telegramWebApp) {
      telegramWebApp.ready();
      telegramWebApp.expand();
    }

    function getFormPayload(form) {
      const payload = {};
      const formData = new FormData(form);
      for (const [key, value] of formData.entries()) {
        payload[key] = value;
      }
      return payload;
    }

    function formatError(data) {
      if (typeof data === "string") return data;
      if (data && data.detail) return data.detail;
      return JSON.stringify(data, null, 2);
    }

    async function submitTechnicianForm(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector("button[type='submit']");
      const result = document.getElementById("result");
      result.className = "result";
      result.textContent = "";
      button.disabled = true;

      try {
        const initData = telegramWebApp ? telegramWebApp.initData : "";
        const submissionToken = new URLSearchParams(window.location.search).get("submission_token") || "";
        const response = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Telegram-WebApp-InitData": initData,
            "X-Technician-Form-Token": submissionToken
          },
          body: JSON.stringify(getFormPayload(form))
        });
        const data = await response.json();
        if (!response.ok) {
          throw data;
        }
        const identifier = data.contract_number || data.id || "created";
        result.className = "result success";
        result.textContent = `Submitted successfully. Reference: ${identifier}`;
      } catch (error) {
        button.disabled = false;
        result.className = "result error";
        result.textContent = `Submission failed: ${formatError(error)}`;
      }
    }

    function setFieldValue(id, value) {
      const field = document.getElementById(id);
      if (field && value !== undefined && value !== null) {
        field.value = value;
      }
    }

    function localDateValue(isoValue) {
      if (!isoValue) return "";
      const date = new Date(isoValue);
      if (Number.isNaN(date.getTime())) return "";
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function applyCalendarEvent(eventData) {
      setFieldValue("google_event_id", eventData.google_event_id);
      setFieldValue("job_number", eventData.job_number || "");
      setFieldValue("address", eventData.location || "");
      setFieldValue("customer_address", eventData.location || "");
      setFieldValue("report_date", localDateValue(eventData.start_at));
      setFieldValue("contract_date", localDateValue(eventData.start_at));
    }

    async function loadCalendarEvents() {
      const picker = document.getElementById("calendar-event-picker");
      const list = document.getElementById("calendar-event-list");
      if (!picker || !list) return;

      try {
        const initData = telegramWebApp ? telegramWebApp.initData : "";
        const submissionToken = new URLSearchParams(window.location.search).get("submission_token") || "";
        const response = await fetch("/api/technician/calendar-events/", {
          headers: {
            "X-Telegram-WebApp-InitData": initData,
            "X-Technician-Form-Token": submissionToken
          }
        });
        const data = await response.json();
        if (!response.ok) throw data;
        if (!data.events || !data.events.length) {
          list.textContent = "";
          const empty = document.createElement("p");
          empty.textContent = "No active jobs found for today.";
          list.appendChild(empty);
          return;
        }
        list.innerHTML = "";
        data.events.forEach((eventData, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "event-option";
          const title = document.createElement("strong");
          title.textContent = `${index + 1}. ${eventData.title || "Untitled job"}`;
          const time = document.createElement("span");
          time.textContent = eventData.time_label || "";
          const location = document.createElement("span");
          location.textContent = eventData.location || "No address";
          button.append(title, time, location);
          if (eventData.report_count) {
            const reportCount = document.createElement("span");
            reportCount.textContent = `Report already submitted: ${eventData.report_count}`;
            button.append(reportCount);
          }
          button.addEventListener("click", () => {
            document.querySelectorAll(".event-option").forEach((item) => item.classList.remove("selected"));
            button.classList.add("selected");
            applyCalendarEvent(eventData);
          });
          list.appendChild(button);
        });
      } catch (error) {
        list.textContent = "";
        const message = document.createElement("p");
        message.textContent = `Could not load jobs: ${formatError(error)}`;
        list.appendChild(message);
      }
    }

    document.querySelector("form").addEventListener("submit", submitTechnicianForm);
    loadCalendarEvents();
  </script>
</body>
</html>
