<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --surface: #ffffff;
      --text: #162033;
      --muted: #65738a;
      --line: #d8dee9;
      --accent: #0f766e;
      --accent-dark: #0b5f59;
      --danger: #b42318;
      --success: #067647;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
    }
    main {
      width: min(720px, 100%);
      margin: 0 auto;
      padding: 20px 14px 40px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 26px;
      letter-spacing: 0;
    }
    .subtitle {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
    }
    form {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(20, 32, 50, 0.08);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    @media (min-width: 640px) {
      .grid.two { grid-template-columns: 1fr 1fr; }
      .full { grid-column: 1 / -1; }
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      font-size: 14px;
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      font: inherit;
      color: var(--text);
      background: #fff;
    }
    textarea { min-height: 96px; resize: vertical; }
    button {
      width: 100%;
      margin-top: 18px;
      border: 0;
      border-radius: 8px;
      padding: 14px 16px;
      font: inherit;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
    }
    button:disabled { opacity: 0.65; }
    button:not(:disabled):active { background: var(--accent-dark); }
    .notice {
      margin: 0 0 14px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #fff7ed;
      color: #9a3412;
      font-size: 13px;
    }
    .result {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      white-space: pre-wrap;
    }
    .result.success {
      display: block;
      color: var(--success);
      background: #ecfdf3;
    }
    .result.error {
      display: block;
      color: var(--danger);
      background: #fef3f2;
    }
  </style>
</head>
<body>
  <main>
    <h1>{{ title }}</h1>
    <p class="subtitle">Submitted securely to the HVAC Operations backend.</p>
    <p class="notice">{{ insecure_secret_warning }}</p>
    {% block form %}{% endblock %}
  </main>
  <script>
    const endpoint = "{{ endpoint }}";
    const telegramWebApp = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (telegramWebApp) {
      telegramWebApp.ready();
      telegramWebApp.expand();
    }

    function getFormPayload(form) {
      const payload = {};
      const formData = new FormData(form);
      for (const [key, value] of formData.entries()) {
        payload[key] = value;
      }
      return payload;
    }

    function formatError(data) {
      if (typeof data === "string") return data;
      if (data && data.detail) return data.detail;
      return JSON.stringify(data, null, 2);
    }

    async function submitTechnicianForm(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector("button[type='submit']");
      const result = document.getElementById("result");
      result.className = "result";
      result.textContent = "";
      button.disabled = true;

      try {
        const initData = telegramWebApp ? telegramWebApp.initData : "";
        const response = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Telegram-WebApp-InitData": initData
          },
          body: JSON.stringify(getFormPayload(form))
        });
        const data = await response.json();
        if (!response.ok) {
          throw data;
        }
        const identifier = data.contract_number || data.id || "created";
        result.className = "result success";
        result.textContent = `Submitted successfully. Reference: ${identifier}`;
      } catch (error) {
        button.disabled = false;
        result.className = "result error";
        result.textContent = `Submission failed: ${formatError(error)}`;
      }
    }

    document.querySelector("form").addEventListener("submit", submitTechnicianForm);
  </script>
</body>
</html>
